<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lieblingsteams auswählen, speichern und ihre Tabellen verfolgen."
    />
    <title>Lieblingsteams · The Football Page</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <script type="module" src="../js/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../">
          <img src="../assets/favicon.svg" alt="" width="32" height="32" />
          <span>The Football Page</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="nav-toggle-bar"></span>
          <span class="visually-hidden">Menü öffnen</span>
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Hauptnavigation">
          <ul>
            <li><a href="../">Aktuelle Spiele</a></li>
            <li><a href="./" aria-current="page">Lieblingsteams</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
      <section class="hero hero--compact">
        <h1>Lieblingsteams</h1>
        <p>
          Wähle deine Teams, speichere sie als Favoriten und behalte ihre
          Tabellen im Blick.
        </p>
      </section>

      <section
        id="meine-teams"
        class="section"
        aria-labelledby="favorites-title"
      >
        <div class="section-header">
          <div>
            <h2 id="favorites-title">Meine Teams</h2>
            <p class="text-muted">Noch keine Teams gespeichert.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 The Football Page</p>
        <p>Einzelprojekt · Berner Fachhochschule</p>
      </div>
    </footer>
  </body>
</html>
